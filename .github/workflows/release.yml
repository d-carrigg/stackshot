# Combined tag + release pipeline. Runs on every push to main:
#   1. Read the version from pyproject.toml. If the v<version> tag
#      doesn't exist yet, create and push it.
#   2. If a new tag was created, fan out to a per-OS PyInstaller matrix
#      that builds the standalone binary and attaches it to the release.
#
# Why one workflow instead of two? GitHub Actions deliberately suppresses
# workflow triggers from pushes made by GITHUB_TOKEN (to prevent
# recursive run loops). So a separate "build on tag push" workflow
# never fired when auto-tag pushed via the default token. Folding the
# binary-build job into the same workflow as the tag step sidesteps
# that limitation entirely — no PAT required.
name: release
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      new-tag: ${{ steps.check.outputs.exists == 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Read version from pyproject.toml
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Check if tag already exists
        id: check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  # PyPI publish is disabled until trusted publishing is configured on
  # PyPI. To enable:
  #   1. Make sure the repo is public.
  #   2. Configure trusted publisher at https://pypi.org/manage/account/publishing/
  #      (owner=d-carrigg, project=stackshot, workflow=release.yml, environment=pypi).
  #   3. Create GitHub Environment named `pypi` (Settings → Environments).
  #   4. Uncomment the publish-pypi job below.
  #   5. Add `needs: [tag-version, publish-pypi]` to build-binaries.
  #
  # publish-pypi:
  #   needs: tag-version
  #   if: needs.tag-version.outputs.new-tag == 'true'
  #   runs-on: ubuntu-latest
  #   environment: pypi
  #   permissions:
  #     contents: read
  #     id-token: write
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
  #       with: { ref: ${{ needs.tag-version.outputs.tag }} }
  #     - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
  #     - run: uv build
  #     - run: uv publish --trusted-publishing always

  build-binaries:
    needs: tag-version
    if: needs.tag-version.outputs.new-tag == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  asset: stackshot-linux-x86_64,       ext: "" }
          - { os: macos-latest,   asset: stackshot-macos-arm64,        ext: "" }
          - { os: windows-latest, asset: stackshot-windows-x86_64.exe, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Pull the tagged commit so the binary reports the right
          # version even if main has moved on by the time the matrix
          # finishes (e.g. a second merge while binaries are building).
          ref: ${{ needs.tag-version.outputs.tag }}
          # This job runs third-party build tooling; don't leave the
          # write-scoped token in .git/config. The release action reads
          # its token from the job, not from git.
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # --locked: build from uv.lock exactly (incl. the pinned pyinstaller
      # in the `build` group) so shipped binaries are reproducible.
      - run: uv sync --locked --group build
      - name: Stage package for PyInstaller
        shell: bash
        # The setuptools layout maps the `stackshot` package to `src/cli`
        # (see [tool.setuptools] in pyproject.toml). PyInstaller wants a
        # real `stackshot/` directory with `__main__.py` at its root, so
        # we mirror src/cli/ → stackshot/ (NOT all of src/ — that would
        # nest the entry point under stackshot/cli/__main__.py and break
        # the build).
        run: |
          python -c "import shutil; shutil.rmtree('stackshot', ignore_errors=True); shutil.copytree('src/cli', 'stackshot')"
      - name: Build binary
        shell: bash
        run: |
          uv run --locked --group build pyinstaller --onefile --name stackshot \
            --collect-all pygments --collect-all prompt_toolkit \
            stackshot/__main__.py
      - name: Rename for platform
        shell: bash
        run: mv "dist/stackshot${{ matrix.ext }}" "dist/${{ matrix.asset }}"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.tag-version.outputs.tag }}
          files: dist/${{ matrix.asset }}
          fail_on_unmatched_files: true
      - name: Attach license bundle to release
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.tag-version.outputs.tag }}
          files: |
            LICENSE
            THIRD_PARTY_LICENSES.md
            THIRD_PARTY_LICENSES_WEB.md
          fail_on_unmatched_files: true
