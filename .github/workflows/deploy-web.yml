name: deploy-web

# Deploy the static web app to Azure Static Web Apps.
#
# Production deploys ship on every push to main. We deliberately don't
# chain off the v* tags that release.yml creates, because GitHub's
# workflow recursion guard means a tag pushed using GITHUB_TOKEN does
# NOT trigger other workflows — the tag chain silently never fires.
# Triggering on push to main is the simplest fix and matches the
# user-stated goal of "deploy on merge".
#
# workflow_dispatch is exposed so a redeploy can be kicked off from
# the Actions tab without a code change.
#
# PR previews go up for every PR against main so reviewers can click
# through the change, except Dependabot PRs: those workflows do not
# receive repo secrets, so the Azure action would fail with
# "deployment_token was not provided". Skip the jobs when
# github.actor is dependabot[bot]. SKIP_DEPLOY_ON_MISSING_SECRETS is
# a documented env (not a with: input) so forks/missing tokens skip
# the upload instead of failing the job.
#
# The deployment token lives in the AZURE_STATIC_WEB_APPS_API_TOKEN secret.
# It's an Azure SWA "deployment token" — scoped to this single SWA resource;
# rotate from the Azure portal if leaked.
on:
  push:
    branches: [main]
    paths:
      - "src/web/**"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "src/web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-deploy:
    if: "github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.action != 'closed')"
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          lfs: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/web/package-lock.json
      - name: Install
        working-directory: src/web
        run: npm ci
      - name: Build
        working-directory: src/web
        run: npm run build
      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          SKIP_DEPLOY_ON_MISSING_SECRETS: true
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # We built locally; point app_location straight at the built
          # output so Azure uploads dist/ (not the TypeScript source).
          # staticwebapp.config.json lives in src/web/public so Vite
          # copies it into dist/ at build time.
          app_location: "src/web/dist"
          skip_app_build: true
          skip_api_build: true

  close-preview:
    if: "github.actor != 'dependabot[bot]' && github.event_name == 'pull_request' && github.event.action == 'closed'"
    runs-on: ubuntu-latest
    name: Close PR preview
    steps:
      - name: Close preview environment
        uses: Azure/static-web-apps-deploy@v1
        env:
          SKIP_DEPLOY_ON_MISSING_SECRETS: true
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
