name: deploy-web

# Deploy the static web app to Azure Static Web Apps on production
# releases. We're on the SWA Free plan, which doesn't support preview
# environments — so no pull_request trigger. Production ships on v*
# tag pushes (the same tags auto-tag.yml creates from a version bump
# after a merge to main).
#
# The deployment token lives in the AZURE_STATIC_WEB_APPS_API_TOKEN
# secret. It's scoped to this single SWA resource; rotate from the
# Azure portal if leaked.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/web/package-lock.json
      - name: Install
        working-directory: src/web
        run: npm ci
      - name: Build
        working-directory: src/web
        run: npm run build
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          # We already built locally; tell Azure's image to skip its own.
          app_location: "src/web"
          output_location: "dist"
          skip_app_build: true
          skip_api_build: true
