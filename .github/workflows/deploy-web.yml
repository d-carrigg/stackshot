name: deploy-web

# Deploy the static web app to Azure Static Web Apps via the SWA CLI.
# We deliberately avoid the Azure/static-web-apps-deploy@v1 action: it's
# a Docker action that pulls mcr.microsoft.com/appsvc/staticappsclient,
# and MCR has been intermittently returning 403 to GitHub-hosted runners.
# The SWA CLI is pure Node and uses the same deployment token, so this
# path doesn't depend on MCR being reachable.
#
# Triggers:
#   - v* tag push      → production deploy
#   - PR against main  → preview environment named pr-<PR#>
#                        (preview URL is posted as a PR comment)
#
# Secret: AZURE_STATIC_WEB_APPS_API_TOKEN — scoped to the single SWA
# resource; rotate from the Azure portal if leaked.
on:
  push:
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "src/web/**"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/web/package-lock.json

      - name: Install
        working-directory: src/web
        run: npm ci

      - name: Build
        working-directory: src/web
        run: npm run build

      - name: Deploy
        id: deploy
        working-directory: src/web
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ENV_NAME="pr-${{ github.event.pull_request.number }}"
          else
            ENV_NAME="production"
          fi
          echo "Deploying to env: $ENV_NAME"
          # `swa deploy` prints a line like:
          #   Project deployed to → https://<host>.azurestaticapps.net
          # Capture stdout so we can extract the URL for the PR comment.
          OUTPUT=$(npx --yes @azure/static-web-apps-cli@latest deploy ./dist \
              --deployment-token "$SWA_TOKEN" \
              --env "$ENV_NAME" \
              --no-use-keychain \
              --verbose silly | tee /dev/stderr)
          URL=$(printf '%s\n' "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.azurestaticapps\.net[^[:space:]]*' | tail -1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.deploy.outputs.url }}`;
            const marker = '<!-- swa-preview-url -->';
            const body = `${marker}\n🔎 **SWA preview:** ${url}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
