name: deploy-web

# Deploy the static web app to Azure Static Web Apps. Mirrors release.yml's
# trigger model: production deploys ship on v* tag pushes (the same tags
# auto-tag.yml creates from a version bump), and PR previews go up for
# every PR against main so reviewers can click through the change.
#
# The deployment token lives in the AZURE_STATIC_WEB_APPS_API_TOKEN secret.
# It's an Azure SWA "deployment token" — scoped to this single SWA resource;
# rotate from the Azure portal if leaked.
on:
  push:
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "src/web/**"
      - "staticwebapp.config.json"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/web/package-lock.json
      - name: Install
        working-directory: src/web
        run: npm ci
      - name: Build
        working-directory: src/web
        run: npm run build
      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # We already built locally; tell the Oryx build to skip its own.
          app_location: "src/web"
          output_location: "dist"
          skip_app_build: true
          skip_api_build: true

  close-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR preview
    steps:
      - name: Close preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
