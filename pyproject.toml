[project]
name = "stackshot"
version = "0.17.1"
description = "Compose code snippets, screenshots, and images into multi-panel illustrations — for READMEs, docs, blog posts, and tutorials"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "d-carrigg" }]
keywords = ["screenshot", "code", "image", "syntax-highlight", "cli", "pygments", "markdown"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "pillow>=13.0.0",
  "prompt-toolkit>=3.0.43",
  "pygments>=2.20.0",
]

[project.optional-dependencies]
ui = ["tkinterdnd2>=0.4.3"]

[project.urls]
Homepage = "https://github.com/d-carrigg/stackshot"
Repository = "https://github.com/d-carrigg/stackshot"
Issues = "https://github.com/d-carrigg/stackshot/issues"
Changelog = "https://github.com/d-carrigg/stackshot/blob/main/CHANGELOG.md"

[project.scripts]
stackshot = "stackshot.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stackshot"]
package-dir = { "stackshot" = "src/cli" }

[dependency-groups]
dev = ["pytest>=8.0"]
# Release-binary tooling (see .github/workflows/release.yml); pinned via uv.lock.
build = ["pyinstaller>=6"]
