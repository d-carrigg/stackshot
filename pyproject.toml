[project]
name = "codeimg"
version = "0.2.4"
description = "Compose code snippets, screenshots, and images into multi-panel illustrations — for READMEs, docs, blog posts, and tutorials"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "d-carrigg" }]
keywords = ["screenshot", "code", "image", "syntax-highlight", "cli", "pygments", "markdown"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "pillow>=12.2.0",
  "prompt-toolkit>=3.0.43",
  "pygments>=2.20.0",
]

[project.urls]
Homepage = "https://github.com/d-carrigg/codeimg"
Repository = "https://github.com/d-carrigg/codeimg"
Issues = "https://github.com/d-carrigg/codeimg/issues"
Changelog = "https://github.com/d-carrigg/codeimg/blob/main/CHANGELOG.md"

[project.scripts]
codeimg = "codeimg.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["codeimg"]
package-dir = { "codeimg" = "src" }

[dependency-groups]
dev = ["pytest>=8.0"]
