[project]
name = "codeshot"
version = "0.1.0"
description = "Side-by-side code/image screenshots"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.4.0",
    "prompt-toolkit>=3.0.43",
    "pygments>=2.18.0",
]

[project.scripts]
codeshot = "codeshot.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["codeshot"]
package-dir = {"codeshot" = "src"}

[dependency-groups]
dev = ["pytest>=8.0"]
